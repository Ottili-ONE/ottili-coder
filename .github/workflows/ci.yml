name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep checkouts on LF
        # .gitattributes already pins `eol=lf`, which outranks core.autocrlf.
        # This is defence in depth for any path the attributes do not match:
        # a CRLF checkout fails `prettier --check` on the entire tree at once.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:eol
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:recovery
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm test:package

  # Exercises the repo's own action.yml (`uses: ./`) end to end: builds the
  # daemon/CLI it wraps, creates a real durable Run, and polls it. No
  # provider credentials are configured, so the Run is expected to reach
  # `waiting_external` (an authentication ProviderFailure on its first turn)
  # rather than `completed` — proving the action's plumbing (daemon
  # start/stop, Run creation, status polling, non-completion reporting)
  # without needing a real provider key in this repo's CI.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invoke the action with no provider configured
        id: invoke
        continue-on-error: true
        uses: ./
        with:
          prompt: "Say hello."
          timeout-minutes: "1"
      - name: Assert the action reported the expected non-completed status
        env:
          INVOKE_OUTCOME: ${{ steps.invoke.outcome }}
          INVOKE_STATUS: ${{ steps.invoke.outputs.status }}
          INVOKE_SUMMARY: ${{ steps.invoke.outputs.summary }}
        run: |
          if [ "$INVOKE_OUTCOME" != "failure" ]; then
            echo "::error::Expected the action to fail without provider credentials, got outcome '$INVOKE_OUTCOME'."
            exit 1
          fi
          if [ "$INVOKE_STATUS" != "waiting_external" ]; then
            echo "::error::Expected status waiting_external, got '$INVOKE_STATUS'."
            exit 1
          fi
          echo "Action smoke test passed: $INVOKE_SUMMARY"
